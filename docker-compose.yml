version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sdohtwin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdohtwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdohtwin}
      POSTGRES_DB: ${POSTGRES_DB:-sdohtwin}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdohtwin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdohtwin_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sdohtwin}:${POSTGRES_PASSWORD:-sdohtwin}@db:5432/${POSTGRES_DB:-sdohtwin}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Permite llegar a Langflow corriendo en el host (localhost:7860)
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdohtwin_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  streamlit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdohtwin_streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sdohtwin}:${POSTGRES_PASSWORD:-sdohtwin}@db:5432/${POSTGRES_DB:-sdohtwin}
      PYTHONPATH: /app
      LANGFLOW_FLOW_FILE: /langflow/sdoh_assistant.json
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    volumes:
      - ./backend:/app
      - ./langflow:/langflow:ro
    command: streamlit run streamlit_app/crispdm_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false

volumes:
  postgres_data:
